// ---------- QUIZ LOGIC (Paper Navigation, Timer, Palette & Evaluation) ----------
const questionTextEl = document.getElementById('question-text');
const optionsListEl = document.getElementById('options-list');
const nextBtn = document.getElementById('next-btn');
const backBtn = document.getElementById('back-btn');
const progressTextEl = document.getElementById('progress-text');
const timerEl = document.getElementById('timer');
const navPaletteEl = document.getElementById('navigation-palette');
const quizContentEl = document.getElementById('quiz-content');
const paperSelectionContainerEl = document.getElementById('paper-selection-container');
const paperSelectionGridEl = document.getElementById('paper-selection-grid');
const feedbackEl = document.getElementById('feedback');
const explanationTextEl = document.getElementById('explanation-text');

const QUESTIONS_PER_PAPER = 20; // 2 parts of 20 questions each, or adjust as needed
const TOTAL_PAPERS = Math.ceil(fullQuizData.length / QUESTIONS_PER_PAPER);
const quizTimeInMinutes = 45; 

let currentPaperData = [];
let currentPaperIndex = 0;
let timeRemaining = quizTimeInMinutes * 60;
let timerInterval;
let quizFinished = false;

let currentQuestionIndex = 0;
let allUserAnswers = new Array(fullQuizData.length).fill(null);

function startTimer() {
    timerEl.style.display = 'inline-block';
    timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer() {
    if (quizFinished) return;
    timeRemaining--;
    const minutes = Math.floor(timeRemaining / 60);
    let seconds = timeRemaining % 60;

    seconds = seconds < 10 ? '0' + seconds : seconds;
    const minutesStr = minutes < 10 ? '0' + minutes : minutes;

    timerEl.innerText = `${minutesStr}:${seconds}`;

    if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        showResults(true); 
    }
}

function loadPaper(paperNumber) {
    const startIndex = (paperNumber - 1) * QUESTIONS_PER_PAPER;
    const endIndex = Math.min(startIndex + QUESTIONS_PER_PAPER, fullQuizData.length);
    
    currentPaperData = fullQuizData.slice(startIndex, endIndex);
    currentPaperIndex = paperNumber - 1;

    paperSelectionContainerEl.style.display = 'none';
    quizContentEl.style.display = 'block';

    currentQuestionIndex = 0; 
    renderNavigationPalette();
    loadQuestion();
    if (!timerInterval) startTimer();
}

function renderPaperSelection() {
    paperSelectionGridEl.innerHTML = '';
    for (let i = 0; i < TOTAL_PAPERS; i++) {
        const startQ = i * QUESTIONS_PER_PAPER + 1;
        const endQ = Math.min((i + 1) * QUESTIONS_PER_PAPER, fullQuizData.length);
        const paperItem = document.createElement('div');
        paperItem.classList.add('paper-item');
        paperItem.dataset.paperNumber = i + 1;
        paperItem.innerHTML = `
            <div>Section / Paper ${i + 1}</div>
            <p>Questions ${startQ} - ${endQ}</p>
        `;
        paperItem.addEventListener('click', (e) => {
            loadPaper(parseInt(e.currentTarget.dataset.paperNumber));
        });
        paperSelectionGridEl.appendChild(paperItem);
    }
}

function renderNavigationPalette() {
    navPaletteEl.innerHTML = '';
    for (let i = 0; i < currentPaperData.length; i++) {
        const navItem = document.createElement('div');
        navItem.innerText = i + 1;
        navItem.classList.add('nav-item');
        navItem.dataset.index = i;
        navItem.addEventListener('click', (e) => {
            jumpToQuestion(parseInt(e.target.dataset.index));
        });
        navPaletteEl.appendChild(navItem);
    }
    updateNavigationPalette();
}

function updateNavigationPalette() {
    const navItems = navPaletteEl.children;
    const globalStartIndex = currentPaperIndex * QUESTIONS_PER_PAPER;

    for (let i = 0; i < navItems.length; i++) {
        const item = navItems[i];
        const globalIndex = globalStartIndex + i;
        item.classList.remove('current', 'answered-correct', 'answered-incorrect');

        const answerIndex = allUserAnswers[globalIndex];

        if (answerIndex !== null) {
            const currentQuestion = fullQuizData[globalIndex];
            if (answerIndex === currentQuestion.correct) {
                item.classList.add('answered-correct');
            } else {
                item.classList.add('answered-incorrect');
            }
        }
        
        if (i === currentQuestionIndex) {
            item.classList.add('current');
        }
    }
}

function jumpToQuestion(index) {
    if (index >= 0 && index < currentPaperData.length) {
        currentQuestionIndex = index;
        loadQuestion();
    }
}

function loadQuestion() {
    const currentQuestion = currentPaperData[currentQuestionIndex];
    const questionNumberInPaper = currentQuestionIndex + 1;
    const globalQuestionIndex = (currentPaperIndex * QUESTIONS_PER_PAPER) + currentQuestionIndex;

    questionTextEl.innerHTML = `${globalQuestionIndex + 1}. ${currentQuestion.question}`;
    optionsListEl.innerHTML = '';
    feedbackEl.style.display = 'none';
    
    backBtn.disabled = currentQuestionIndex === 0;
    
    if (currentQuestionIndex === currentPaperData.length - 1) {
        nextBtn.innerText = currentPaperIndex === TOTAL_PAPERS - 1 ? 'ප්‍රතිඵල බලන්න (Show Results)' : 'ඊළඟ කොටස (Next Section)';
    } else {
        nextBtn.innerText = 'ඊළඟ ප්‍රශ්නය (Next)';
    }

    const currentAnswer = allUserAnswers[globalQuestionIndex];

    currentQuestion.options.forEach((option, index) => {
        const li = document.createElement('li');
        li.innerHTML = option;
        li.classList.add('option');
        li.dataset.index = index;
        
        if (currentAnswer === null) {
            li.addEventListener('click', selectAnswer);
        } else {
            li.classList.add('no-hover');
            const correctAnswerIndex = currentQuestion.correct;

            if (index === correctAnswerIndex) {
                li.classList.add('correct');
            }
            if (index === currentAnswer && currentAnswer !== correctAnswerIndex) {
                li.classList.add('incorrect');
            }
        }
        optionsListEl.appendChild(li);
    });

    if (currentAnswer !== null) {
        showFeedback(currentQuestion);
    }
    
    progressTextEl.innerText = `Question ${questionNumberInPaper} of ${currentPaperData.length} (Section ${currentPaperIndex + 1})`;
    updateNavigationPalette();
}

function selectAnswer(e) {
    const globalQuestionIndex = (currentPaperIndex * QUESTIONS_PER_PAPER) + currentQuestionIndex;
    if (allUserAnswers[globalQuestionIndex] !== null) return; 

    const selectedOption = e.target.closest('.option');
    if (!selectedOption) return;

    const selectedAnswerIndex = parseInt(selectedOption.dataset.index);
    allUserAnswers[globalQuestionIndex] = selectedAnswerIndex;

    const currentQuestion = currentPaperData[currentQuestionIndex];
    const correctAnswerIndex = currentQuestion.correct;

    if (selectedAnswerIndex === correctAnswerIndex) {
        selectedOption.classList.add('correct');
    } else {
        selectedOption.classList.add('incorrect');
        optionsListEl.children[correctAnswerIndex].classList.add('correct');
    }
    
    Array.from(optionsListEl.children).forEach(child => {
        child.removeEventListener('click', selectAnswer);
        child.classList.add('no-hover');
    });

    showFeedback(currentQuestion);
    updateNavigationPalette();
}

function showFeedback(question) {
    explanationTextEl.innerHTML = `<b>නිවැරදි පිළිතුර:</b> ${question.options[question.correct]}<br><br>${question.explanation}`;
    feedbackEl.style.display = 'block';
}

function showResults(timeIsUp = false) {
    quizFinished = true;
    clearInterval(timerInterval);
    
    let totalScore = 0;
    let attempted = 0;
    for (let i = 0; i < fullQuizData.length; i++) {
        if (allUserAnswers[i] !== null) {
            attempted++;
            if (allUserAnswers[i] === fullQuizData[i].correct) {
                totalScore++;
            }
        }
    }

    let resultTitle = timeIsUp ? `කාලය අවසන්!` : `විභාග පෙරහුරුව සාර්ථකව අවසන්!`;
    const quizContainer = document.getElementById('quiz-container');

    quizContainer.innerHTML = `
        <div id="header">
            <h2>${resultTitle}</h2>
            <p>IT3070 Information Assurance & Security Examination Performance</p>
        </div>
        <div id="question-area" style="text-align: center; padding: 40px 20px;">
            <p style="font-size: 1.3em; margin: 0; color: #475569;">ඔබ ලබාගත් සම්පූර්ණ ලකුණු ප්‍රමාණය:</p>
            <p style="font-size: 3.5em; font-weight: 800; color: #0284c7; margin: 15px 0;">${totalScore} / ${fullQuizData.length}</p>
            <p style="font-size: 1.05em; color: #64748b; margin-bottom: 25px;">පිළිතුරු සැපයූ ප්‍රශ්න ගණන: ${attempted} | නිවැරදි ප්‍රතිශතය: ${Math.round((totalScore / fullQuizData.length) * 100)}%</p>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button id="restart-btn" class="nav-btn" style="background-color: #0284c7; padding: 14px 28px; font-size: 1.05em;">නැවත මුල සිට ආරම්භ කරන්න</button>
            </div>
        </div>
    `;
    document.getElementById('restart-btn').addEventListener('click', () => {
        location.reload();
    });
}

nextBtn.addEventListener('click', () => {
    if (currentQuestionIndex < currentPaperData.length - 1) {
        currentQuestionIndex++;
        loadQuestion();
    } else {
        if (currentPaperIndex < TOTAL_PAPERS - 1) {
            loadPaper(currentPaperIndex + 2);
        } else {
            showResults();
        }
    }
});

backBtn.addEventListener('click', () => {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        loadQuestion();
    }
});

// Initial Load
renderPaperSelection();
</script>
</body>
